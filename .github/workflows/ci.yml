name: CI

on:
  push:
    branches: [main]
  pull_request:

# semantic-release: push the release commit, create the release, comment on released issues/PRs.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs all tags and commits
      # setup-java's own Gradle cache: setup-gradle v6 moved its caching under proprietary terms.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Checks only, no APK: that is built on main alone, by semantic-release (.releaserc.yaml) when it releases.
      # Lint fails the build on errors, not on warnings.
      - run: ./gradlew testDebugUnitTest lintDebug

      - if: github.event_name == 'push'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          npx -y -p semantic-release@25 -p @semantic-release/changelog@7 -p @semantic-release/git@11 -p @semantic-release/exec@7 semantic-release
